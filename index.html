<!doctype html>
<html lang="cs">
<head>

<title>Atlas náboženství</title>

</head>
<body>

<main class="wrap">
  <div id="app" aria-busy="true"><p class="loading">Načítám data…</p></div>
</main>

<footer class="foot">
  <p>Zóny vlivu jsou schematické a vycházejí z dnešních hranic států. Podíly věřících před 20. stoletím jsou hrubé odhady, údaj pro současnost vychází z Pew Research (2020).</p>
</footer>

<dialog id="modal" aria-labelledby="modal-title"></dialog>

<script src="js/app.js"></script>

</html>
